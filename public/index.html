<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Links</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js" defer></script>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Links</h1>
        <div class="actions">
          <button id="btn-import">Import</button>
          <button id="btn-export">Export</button>
          <button id="btn-new" class="primary">+ Add link</button>
          <input
            type="file"
            id="file-import"
            accept="application/json"
            class="hidden"
          />
        </div>
      </header>

      <div class="modal-backdrop" id="form-panel">
        <div
          class="panel modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="form-title"
          style="margin: 0; max-height: 90vh; overflow: auto"
        >
          <h2 id="form-title" style="margin: 0 0 12px; font-size: 1.15rem">
            Add link
          </h2>
          <form class="link-form" id="link-form" autocomplete="off">
            <div class="row">
              <label
                >Title (optional)
                <input
                  type="text"
                  id="f-title"
                  placeholder="e.g. MDN Web Docs"
                />
              </label>
              <label
                >URL
                <input
                  type="url"
                  id="f-url"
                  placeholder="https://example.com"
                  required
                />
              </label>
            </div>
            <label
              >Tags (comma separated)
              <input
                type="text"
                id="f-tags"
                placeholder="reading, dev, design"
              />
            </label>
            <label
              >Notes
              <textarea
                id="f-notes"
                placeholder="Why you saved it..."
              ></textarea>
            </label>
            <div class="error" id="f-error"></div>
            <div class="form-buttons">
              <button type="button" id="f-cancel">Cancel</button>
              <button type="submit" class="primary" id="f-save">
                Save link
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="modal-backdrop" id="confirm-panel">
        <div
          class="panel modal"
          role="alertdialog"
          aria-modal="true"
          aria-labelledby="confirm-title"
          style="margin: 0"
        >
          <h2 id="confirm-title" style="margin: 0 0 8px; font-size: 1.15rem">
            Delete link?
          </h2>
          <p
            id="confirm-text"
            style="margin: 0 0 16px; color: var(--muted)"
          ></p>
          <div class="form-buttons">
            <button type="button" id="confirm-cancel">Cancel</button>
            <button
              type="button"
              class="danger"
              id="confirm-ok"
              style="border-color: var(--danger)"
            >
              Delete
            </button>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <input
          type="search"
          id="search"
          placeholder="Search title, URL, notes, or tags..."
          autocomplete="off"
          autofocus
        />
        <span class="count" id="count"></span>
      </div>

      <div class="tags-filter" id="tag-filters"></div>

      <div class="links" id="links"></div>
    </div>
  </body>
</html>
